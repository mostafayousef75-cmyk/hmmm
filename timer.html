<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام البصمة وساعات العمل - العيادة</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; direction: rtl; color: #333; }
        .container { max-width: 950px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .agents-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 20px; margin-bottom: 35px; }
        .agent-card { background: #fafbfc; padding: 18px; border-radius: 10px; text-align: center; border: 1px solid #e1e8ed; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .agent-card h3 { margin-bottom: 10px; color: #007bff; font-size: 18px; }
        .timer-display { font-size: 20px; font-weight: bold; color: #e67e22; margin: 10px 0; background: #fff5e6; padding: 6px; border-radius: 5px; }
        button { width: 100%; background: #28a745; color: white; border: none; padding: 9px; margin: 5px 0; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s; }
        button.break { background: #ffc107; color: #333; }
        button.back { background: #17a2b8; }
        button.out { background: #dc3545; }
        button:hover { opacity: 0.9; }
        
        .report-section { margin-top: 30px; }
        .report-section h3 { border-bottom: 2px solid #007bff; padding-bottom: 8px; color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e1e8ed; padding: 12px; text-align: center; font-size: 14px; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f8f9fa; }
    </style>
</head>
<body>

<div class="container">
    <h2>⏱️ نظام بصمة العيادة مع عداد الوقت الفعلي</h2>
    
    <div class="agents-grid" id="agentsGrid">
        <!-- يتم توليد الكروت تلقائياً -->
    </div>

    <div class="report-section">
        <h3>📊 سجل الحركات والتقارير</h3>
        <table>
            <thead>
                <tr>
                    <th>التاريخ</th>
                    <th>اسم الموظف</th>
                    <th>الإجراء</th>
                    <th>الوقت</th>
                </tr>
            </thead>
            <tbody id="logTableBody">
                <!-- السجلات -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const agents = ["مصطفى", "أمينة", "مؤمن", "وهبة"];
    let timers = JSON.parse(localStorage.getItem("clinicTimers")) || {};
    let logs = JSON.parse(localStorage.getItem("clinicLogs")) || [];

    const grid = document.getElementById("agentsGrid");
    const logTable = document.getElementById("logTableBody");

    function renderApp() {
        grid.innerHTML = "";
        agents.forEach(agent => {
            let state = timers[agent] || { status: "مغادر", seconds: 0, startTime: null };
            let timeFormatted = formatTime(state.seconds);

            grid.innerHTML += `
                <div class="agent-card">
                    <h3>👤 ${agent}</h3>
                    <div style="font-size: 12px; color: #666;">الحالة: <b>${state.status}</b></div>
                    <div class="timer-display" id="timer_${agent}">${timeFormatted}</div>
                    <button onclick="agentAction('${agent}', 'حضور')">🟢 حضور</button>
                    <button class="break" onclick="agentAction('${agent}', 'استراحة')">☕ استراحة</button>
                    <button class="back" onclick="agentAction('${agent}', 'عودة')">↩️ عودة</button>
                    <button class="out" onclick="agentAction('${agent}', 'خروج نهائي')">🔴 خروج</button>
                </div>
            `;
        });
        renderLogs();
    }

    function formatTime(totalSeconds) {
        let hours = Math.floor(totalSeconds / 3600);
        let minutes = Math.floor((totalSeconds % 3600) / 60);
        let seconds = totalSeconds % 60;
        return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }

    function pad(val) {
        return val > 9 ? val : "0" + val;
    }

    function agentAction(agent, action) {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('ar-EG');
        const dateStr = now.toLocaleDateString('ar-EG');

        if (!timers[agent]) {
            timers[agent] = { seconds: 0, status: "مغادر", active: false };
        }

        if (action === 'حضور') {
            timers[agent].status = "يعمل 🟢";
            timers[agent].active = true;
        } else if (action === 'استراحة') {
            timers[agent].status = "في استراحة ☕";
            timers[agent].active = false;
        } else if (action === 'عودة') {
            timers[agent].status = "يعمل 🟢";
            timers[agent].active = true;
        } else if (action === 'خروج نهائي') {
            timers[agent].status = "خارج الدوام 🔴";
            timers[agent].active = false;
            timers[agent].seconds = 0; // تصفير العداد لليوم التالي
        }

        logs.unshift({ date: dateStr, agent: agent, action: action, time: timeStr });
        localStorage.setItem("clinicTimers", JSON.stringify(timers));
        localStorage.setItem("clinicLogs", JSON.stringify(logs));
        renderApp();
    }

    // تشغيل العدادات ثانية بثانية
    setInterval(() => {
        let updated = false;
        agents.forEach(agent => {
            if (timers[agent] && timers[agent].active) {
                timers[agent].seconds++;
                updated = true;
                let el = document.getElementById(`timer_${agent}`);
                if (el) el.innerText = formatTime(timers[agent].seconds);
            }
        });
        if (updated) {
            localStorage.setItem("clinicTimers", JSON.stringify(timers));
        }
    }, 1000);

    function renderLogs() {
        logTable.innerHTML = "";
        if (logs.length === 0) {
            logTable.innerHTML = `<tr><td colspan="4" style="color: #777;">لا توجد سجلات بعد</td></tr>`;
            return;
        }
        logs.forEach(log => {
            logTable.innerHTML += `
                <tr>
                    <td>${log.date}</td>
                    <td><b>${log.agent}</b></td>
                    <td>${log.action}</td>
                    <td>${log.time}</td>
                </tr>
            `;
        });
    }

    renderApp();
</script>

</body>
</html>
